name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  matlab-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2

      - name: Run tests
        uses: matlab-actions/run-tests@v2
        with:
          source-folder: .
          select-by-folder: tests
          test-results-junit: test-results/results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-test-results
          path: test-results/results.xml

  # NOTE: GitHub-hosted runners have no GPU. Tier-1 (ClassAvailabilityTest)
  # needs none and always actually runs - this is the check that would have
  # caught the untracked-file regression this suite was built to guard
  # against. Tier-2 (SmokeFit_*Test) reports as filtered/skipped here via
  # gacelletest.assumeGPU, not failed; it starts actually exercising
  # automatically, with zero workflow changes, if a self-hosted GPU runner
  # is ever added (change `runs-on` above to point at it).
